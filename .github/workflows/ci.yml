name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: ruff check taskwire/ demo/ demo.py
      - run: ruff format --check taskwire/ demo/ demo.py
      - run: pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # `npm install`, not `npm ci`: package-lock.json is deliberately not committed, so that CI
      # resolves dependencies afresh and tests against current upstream rather than a frozen tree.
      - run: npm install
      # eslint, markdownlint and vue-tsc, report only.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build -w demo/client
      - run: npm run docs:build

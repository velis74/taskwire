name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check taskwire/ demo/ demo.py
      - run: uv run ruff format --check taskwire/ demo/ demo.py
      - run: uv run pytest -q
        env:
          # runs `contrib/viewsets_worker_test.py` against a real Celery worker on the service above
          TASKWIRE_WORKER_TEST_REDIS_URL: redis://localhost:6379/14
      - run: uv build

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      # eslint, markdownlint and vue-tsc, report only.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build -w demo/client
      - run: npm run docs:build

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskwire"
dynamic = ["version"]
description = "Progress reporting and awaitable dialogs for long-running server-side operations."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jure Erznožnik", email = "jure.erznoznik@gmail.com" }]
requires-python = ">=3.10"
keywords = ["progress", "dialogs", "celery", "fastapi", "websocket", "dynamicforms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []   # DELIBERATE: core has no runtime dependency of any kind (TW-CORE-006)

[project.optional-dependencies]
redis = ["redis>=5.0"]
celery = ["celery>=5.3", "nest_asyncio>=1.6"]
fastapi = ["fastapi>=0.100"]
# >=0.5.2: the version that carries set_celery_kwargs_hook / set_celery_dispatch_hook
# (register_taskwire_celery_viewset, TW-CELERY-007).
viewsets = ["dynamicforms-fastapi-viewsets>=0.5.2"]
# The socket carries the six request/response calls as viewset commands (TW-REST-004), so the muxws
# extra needs the viewset layer's muxws half as well as muxws itself.
muxws = ["muxws>=0.3.1", "dynamicforms-fastapi-viewsets[muxws]>=0.5.2"]
demo = ["uvicorn>=0.27"]
dev = ["coverage", "pytest", "pytest-asyncio", "pytest-cov", "hypothesis", "httpx", "ruff"]

[project.urls]
Homepage = "https://github.com/velis74/taskwire"
Repository = "https://github.com/velis74/taskwire"
Issues = "https://github.com/velis74/taskwire/issues"
Documentation = "https://docs.velis.si/taskwire/"

[tool.hatch.version]
path = "taskwire/__init__.py"

# The release tool stamps the two manifests by itself. `ts/index.ts` is the third place the version
# is written down - the npm half exports it as `VERSION` - and nothing about a Python manifest points
# at it, so it is named here. `packaging_test.py::test_python_and_npm_versions_match` and
# `ts/packaging.spec.ts` both compare against `package.json`, transitively pinning all three, but only
# once a release has actually bumped this file too.
[tool.publish]
additional_files = ["ts/index.ts"]

[tool.hatch.build.targets.wheel]
packages = ["taskwire"]

[tool.hatch.build.targets.sdist]
include = ["/taskwire", "/conformance", "/README.md", "/LICENSE"]
exclude = ["**/*_test.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# `design` holds the normative specification and the design brief. They are prose that happens to
# quote Python, and ruff would otherwise reformat the code inside their fenced blocks.
exclude = ['docs', 'design', 'ts', 'node_modules', 'dist', 'build', '.git', '.idea',
    '.pytest_cache', '.ruff_cache']
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "Q", "B", "UP", "N", "PT", "S", "C4", "ARG"]
# S105/S106/S107 flag string literals assigned to a parameter named `token`, on the assumption that
# a token is a credential. In taskwire it is the opposite: a token is an operation's *address* and
# explicitly "never an authorization grant" (specification §1, TW-SEC-003). The namespace is the
# only authorization scope, and the library handles no passwords, keys or credentials of any kind,
# so every hit of these three rules is a false positive on a core domain word.
ignore = ["E731", "E722", "C408", "S105", "S106", "S107"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]
"taskwire/conformance.py" = ["S101"]   # the exported suite asserts, and is not a *_test.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = false
lines-between-types = 1
combine-as-imports = true
order-by-type = false

[tool.coverage.run]
omit = ["demo/*", "demo/**/*", "test_*.py", "*_test.py"]

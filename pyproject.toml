[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "taskwire"
version = "0.5.0"
description = "Progress reporting and awaitable dialogs for long-running server-side operations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jure Erznožnik", email = "jure.erznoznik@velis.si" }]
requires-python = ">=3.10"
keywords = ["progress", "dialogs", "celery", "fastapi", "websocket", "dynamicforms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = []   # core has no runtime dependencies (TW-CORE-006)

[project.optional-dependencies]
redis = ["redis>=5.0"]
celery = ["celery>=5.3", "nest_asyncio>=1.6"]
fastapi = ["fastapi>=0.100"]
# >=0.15.3: `Middleware.openapi_parameters_for()`, through which `TaskwireMiddleware` declares its header
# on the operations it tracks only. It also provides: namespaced error codes, forwarded by
# `TaskwireMiddleware` verbatim; one error body for every viewset route; the execution hook and the
# Idempotency-Key helpers; a muxws command that runs its action to the end when its stream ends early
# (TW-CALL-*); delivery filters that run on poll as on push (TW-EVT-004); and executor outcomes as
# library exceptions plus `Middleware.executor_started()` / `on_transition()`, reported on a process
# exit in every pool, so `contrib/viewsets.py` imports no Celery (TW-CALL-101, TW-CALL-105).
viewsets = ["dynamicforms-fastapi-viewsets>=0.15.3"]
# The six request/response calls run as viewset commands over the socket (TW-REST-004).
# muxws >=0.4.1: `Peer.close()` flushes queued frames, so the `goaway` of `goaway_if_stale`
# (TW-WS-007) reaches the client.
muxws = ["muxws>=0.4.1", "dynamicforms-fastapi-viewsets[muxws]>=0.15.3"]

[dependency-groups]
# Everything the test suite, the linters and the demo need.
dev = [
    "taskwire[redis,celery,fastapi,viewsets,muxws]",
    "muxws[websockets]>=0.4.1",
    "uvicorn>=0.27",
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "httpx",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/velis74/taskwire"
Repository = "https://github.com/velis74/taskwire"
Issues = "https://github.com/velis74/taskwire/issues"
Documentation = "https://docs.velis.si/taskwire/"

# `vue/index.ts` exports the version as `VERSION`; the release tool bumps it with the two manifests.
# `packaging_test.py` and `vue/packaging.spec.ts` compare all three against `package.json`.
[tool.publish]
additional_files = ["vue/index.ts"]

[tool.uv.build-backend]
module-name = "taskwire"
module-root = ""
source-include = ["LICENSE", "conformance/**"]
source-exclude = ["**/*_test.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# `design` and `docs` are Markdown with Python code blocks, which ruff would otherwise reformat.
exclude = ['docs', 'design', 'node_modules', 'dist', 'build', '.git', '.idea',
    '.pytest_cache', '.ruff_cache', '.venv']
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "Q", "B", "UP", "N", "PT", "S", "C4", "ARG"]
# S105-S107: `token` is an operation's address, not a credential (TW-SEC-003); the library handles
# no passwords, keys or credentials.
ignore = ["E731", "E722", "C408", "S105", "S106", "S107"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]
"taskwire/conformance.py" = ["S101"]   # the exported suite asserts, and is not a *_test.py

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = false
lines-between-types = 1
combine-as-imports = true
order-by-type = false

[tool.coverage.run]
omit = ["demo/*", "demo/**/*", "test_*.py", "*_test.py"]
